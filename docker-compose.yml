services:
  postgres:
    image: postgres:17-alpine
    container_name: kstm-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kstm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kstm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kstm} -d ${POSTGRES_DB:-kstm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kstm-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.23.0
    container_name: kstm-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # HTTP Browser
      - "127.0.0.1:7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-password123}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ai-worker:
    profiles: ["worker", "prod"]
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: kstm-ai-worker
    restart: unless-stopped
    volumes:
      - /tmp/kstm-uploads:/tmp/kstm-uploads
    environment:
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      NEO4J_URI: ${DOCKER_NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
