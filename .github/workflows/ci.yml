name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-service/requirements.txt'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python environment
        run: |
          python -m venv apps/ai-service/.venv
          apps/ai-service/.venv/bin/pip install --upgrade pip
          apps/ai-service/.venv/bin/pip install -r apps/ai-service/requirements.txt

      - name: Generate Prisma Client
        run: pnpm --filter @kstm/api run db:generate

      - name: Run Linters
        run: pnpm run lint

      - name: Run Test Suites
        env:
          GOOGLE_API_KEY: dummy-key-for-test
          JWT_SECRET: dummy-jwt-secret-for-ci
        run: pnpm run test

      - name: Build Packages
        env:
          JWT_SECRET: dummy-jwt-secret-for-ci
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: pnpm run build
