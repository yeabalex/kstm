services:
  # ==============================================================================
  # KSTM API Gateway & Native RAG Microservice (Free Web Service)
  # ==============================================================================
  - type: web
    name: kstm-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /api/v1/auth/validate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kstm-db
          property: connectionString
      - key: REDIS_URL
        sync: false
        # Paste your free Upstash Redis URL: rediss://...
      - key: NEO4J_URI
        sync: false
        # Paste your free Neo4j AuraDB URI: neo4j+s://...
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
        # Paste your Google AI Studio Gemini API key
      - key: JWT_SECRET
        generateValue: true

# ==============================================================================
# Managed PostgreSQL Database (Free Tier)
# ==============================================================================
databases:
  - name: kstm-db
    plan: free
    databaseName: kstm_db
    user: kstm
    region: oregon
